<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page" data-page="login">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo" src="logo.svg" alt="Logo" />
        <span class="eyebrow">Admin Portal</span>
        <h1>Admin Login</h1>
      </div>

      <form data-login-form data-role="admin">
        <div>
          <label for="adminId">Admin ID or email</label>
          <input id="adminId" name="id" type="text" autocomplete="username" placeholder="Enter Admin ID or email" required />
        </div>

        <div>
          <label for="adminPassword">Password</label>
          <div class="password-field">
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter Password" required />
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
              <svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.1-.8"/></svg>
            </button>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Login</button>
          <a href="#" class="text-link" data-request-password>Request new password from admin</a>
        </div>

        <p class="form-message" aria-live="polite"></p>
      </form>
      <a href="index.html" class="text-link">Back to homepage</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-sync.js"></script>
    <script src="app.js"></script>
  </body>
</html>
