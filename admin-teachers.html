<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Teachers</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="admin-teachers">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-brand"><img class="brand-logo" src="logo-white.svg" alt="" /><span>Admin</span></div><button class="btn btn-secondary" type="button" data-mobile-menu>☰</button></div>
        <nav>
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-students.html">Students</a>
          <a class="active" href="admin-teachers.html">Teachers</a>
          <a href="admin-classes.html">Classes</a>
          <a href="admin-subjects.html">Subjects</a>
          <a href="admin-cbt.html">CBT</a>
          <a href="admin-academic-results.html">Academic Results</a>
          <a href="admin-activities.html">Activities</a>
          <a href="admin-settings.html">Settings</a>
          <a href="index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>
      <main class="main-panel">
        <header class="topbar"><h1 class="page-title">Teachers</h1><div class="topbar-actions"><span class="user-chip">Admin</span><button class="btn btn-secondary" type="button" onclick="logout()">Logout</button></div></header>
        <div class="content">
          <section class="card">
            <div class="card-header"><h3>Add Teacher</h3></div>
            <form id="addTeacherForm" class="form-grid">
              <div><label>Full Name</label><input id="teacherName" type="text" required /></div>
              <div><label>Teacher Unique ID</label><input id="teacherId" type="text" required /></div>
              <div><label for="teacherPassword">Password</label><div class="password-field"><input id="teacherPassword" type="password" minlength="6" placeholder="At least 6 characters" required /><button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false"><svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.1-.8"/></svg></button></div></div>
              <div><span class="small-label">Assigned Classes</span><div id="teacherClassOptions" class="assignment-options"></div></div>
              <div><span class="small-label">Assigned Subjects</span><div id="teacherSubjectOptions" class="assignment-options"></div></div>
              <div><label>Status</label><select id="teacherStatus"><option>Active</option><option>Inactive</option></select></div>
              <div><label for="teacherPhoto">Teacher photo</label><input id="teacherPhoto" type="file" accept="image/*" /></div>
              <div style="grid-column: 1 / -1;"><button class="btn btn-primary" type="submit">Add Teacher</button></div>
            </form>
          </section>

          <section class="table-card" style="margin-top: 1rem;">
            <div class="card-header"><h3>Teacher Records</h3></div>
            <div class="table-wrapper">
              <table>
                <thead><tr><th>Photo</th><th>Teacher ID</th><th>Full Name</th><th>Subject</th><th>Class</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="adminTeachersTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="modal" id="teacherProfileModal" role="dialog" aria-modal="true" aria-labelledby="teacherProfileName">
      <div class="modal-box profile-modal-box">
        <button class="profile-modal-close" type="button" aria-label="Close teacher profile" data-close-teacher-profile>&times;</button>
        <div class="profile-modal-header">
          <img id="teacherProfilePhoto" class="profile-modal-photo" alt="Teacher profile" />
          <div><h3 id="teacherProfileName"></h3><p id="teacherProfileId" class="muted"></p></div>
        </div>
        <dl id="teacherProfileDetails" class="profile-modal-details"></dl>
        <div class="modal-actions">
          <button class="btn btn-secondary" type="button" data-close-teacher-profile>Close</button>
          <button class="btn btn-primary" id="editTeacherProfile" type="button">Edit profile</button>
        </div>
      </div>
    </div>
    <div class="modal" id="editTeacherModal" role="dialog" aria-modal="true" aria-labelledby="editTeacherTitle">
      <div class="modal-box profile-modal-box">
        <h3 id="editTeacherTitle">Edit Teacher</h3>
        <form id="editTeacherForm" class="form-grid">
          <div><label for="editTeacherId">Teacher ID</label><input id="editTeacherId" type="text" readonly /></div>
          <div><label for="editTeacherName">Full Name</label><input id="editTeacherName" type="text" required /></div>
          <div><span class="small-label">Assigned Subjects</span><div id="editTeacherSubjectOptions" class="assignment-options"></div></div>
          <div style="grid-column: 1 / -1;"><span class="small-label">Assigned Classes</span><div id="editTeacherClassOptions" class="assignment-options"></div></div>
          <div><label for="editTeacherStatus">Status</label><select id="editTeacherStatus"><option>Active</option><option>Inactive</option></select></div>
          <div><label for="editTeacherPhoto">Profile photo</label><input id="editTeacherPhoto" type="file" accept="image/*" /></div>
          <div><label for="editTeacherPassword">Set new password</label><div class="password-field"><input id="editTeacherPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Leave blank to keep current" /><button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false"><svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.1-.8"/></svg></button></div></div>
          <div class="modal-actions" style="grid-column: 1 / -1;">
            <button class="btn btn-secondary" id="cancelTeacherEdit" type="button">Cancel</button>
            <button class="btn btn-primary" type="submit">Save changes</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-sync.js"></script>
    <script src="app.js"></script>
  </body>
</html>
